# bs_tsid.conf — BS (2K / ISDB-S) チャンネル → 実 MPEG TS-ID 対応表
#
# smb400-tuner.sh が BS チャンネルを tunertest に渡す際、トランスポンダ内の
# どの TS を選ぶかを決めるための外部テーブル。このファイルを編集すれば
# スクリプト本体 (smb400-tuner.sh) を触らずに TSID の追加・変更ができる。
#
# 書式:  <CHANNEL>  <TSID>        # 空行と '#' 以降は無視
#   CHANNEL … channels.yml の channel フィールドと一致させる (例: BS15_0)
#   TSID    … そのトランスポンダ内の実 MPEG TS-ID (実機 NIT 由来)
#
# 重要 — IF 周波数は CHANNEL 名の "BSxx" 部から算出される:
#   IF_KHZ = 1049480 + (xx-1)/2 * 38360
#   よって TSID が別トランスポンダへ移動した場合は、移動先の BSxx 名で定義し直し、
#   channels.yml の channel も合わせて更新すること (名前結合方式のため)。
#
# このファイルが存在しない/該当行が無い場合は、smb400-tuner.sh 内蔵の
# 既定表へ自動フォールバックする (起動安全のため)。
#
# 出典: 実機 NIT から導出 (2026-06-21)

