# logLevel: <number>
logLevel: 2

# path: <string>
path: /var/run/mirakurun.sock

# port: <number>
# You can change this if port conflicted.
# Don't expose this port on the internet, not even with NAPT.
# Use this in LAN or VPN.
# `~` to disable TCP port listening.
port: 40772

# hostname: <string>
# Browser requests include this name in Origin/Referer when accessed via mDNS.
# Mirakurun rejects unregistered hostnames with HTTP 403.
hostname: pix-smb400.local
